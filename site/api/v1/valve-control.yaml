          description: РЈРЅРёРєР°Р»СЊРЅС‹Р№ РёРґРµРЅС‚РёС„РёРєР°С‚РѕСЂ РўРџРђ (РЅР°РїСЂРёРјРµСЂ, `valve-dn100-01`)
          schema:
