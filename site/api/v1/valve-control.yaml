  description: REST API РґР»СЏ СѓРїСЂР°РІР»РµРЅРёСЏ СЌР»РµРєС‚СЂРѕРїСЂРёРІРѕРґР°РјРё Рё СЃС‡РёС‚С‹РІР°РЅРёСЏ С‚РµР»РµРјРµС‚СЂРёРё Р·Р°РїРѕСЂРЅРѕ-СЂРµРіСѓР»РёСЂСѓСЋС‰РµР№ Р°СЂРјР°С‚СѓСЂС‹ (РўРџРђ).

security:
  - BearerAuth: []

paths:
  /api/v1/valves/{id}/position:
    post:
      summary: РР·РјРµРЅРµРЅРёРµ РїРѕР»РѕР¶РµРЅРёСЏ Р·Р°С‚РІРѕСЂР° Р°СЂРјР°С‚СѓСЂС‹
      operationId: setValvePosition
      parameters:
        - name: id
          in: path
          required: true
          description: РЈРЅРёРєР°Р»СЊРЅС‹Р№ РёРґРµРЅС‚РёС„РёРєР°С‚РѕСЂ РўРџРђ (РЅР°РїСЂРёРјРµСЂ, `valve-dn100-01`)
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - target_position
              properties:
                target_position:
                  type: integer
                  minimum: 0
                  maximum: 100
                  example: 100
      responses:
        '200':
          description: РљРѕРјР°РЅРґР° СѓСЃРїРµС€РЅРѕ РїСЂРёРЅСЏС‚Р° РєРѕРЅС‚СЂРѕР»Р»РµСЂРѕРј
        '401':
          description: РћС‚СЃСѓС‚СЃС‚РІСѓРµС‚ РёР»Рё РЅРµРґРµР№СЃС‚РІРёС‚РµР»РµРЅ JWT-С‚РѕРєРµРЅ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '400':
          description: РћС€РёР±РєР° РїР°СЂР°РјРµС‚СЂРѕРІ Р·Р°РїСЂРѕСЃР°
          content:
            application/json:
