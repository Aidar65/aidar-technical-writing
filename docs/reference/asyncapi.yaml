asyncapi: 2.6.0
info:
  title: Valve MQTT API
  version: 1.2.0
  description: MQTT channels for receiving telemetry and sending commands to valve actuators.

channels:
  valves/{valve_id}/telemetry:
    description: Telemetry stream from the actuator (position, limit switches, torque).
    parameters:
      valve_id:
        description: Valve identifier in KKS encoding.
        schema:
          type: string
          pattern: '^[0-9]{2}[A-Z]{3}[0-9]{2}[A-Z]{2}[0-9]{3}$'
          example: 01JNA10AA001
    subscribe:
      operationId: onValveTelemetry
      summary: Subscribe to valve telemetry
      message:
        contentType: application/json
        payload:
          type: object
          required:
            - position_percent
            - is_open
            - is_closed
          properties:
            position_percent:
              type: number
              format: float
              minimum: 0
              maximum: 100
              description: Valve opening degree in percent.
              example: 45.5
            is_open:
              type: boolean
              description: Limit switch signal for fully open position.
              example: false
            is_closed:
              type: boolean
              description: Limit switch signal for fully closed position.
              example: false
            torque_nm:
              type: number
              format: float
              minimum: 0
              description: Current torque on the stem, Nm.
              example: 120.0

  valves/{valve_id}/command:
    description: Control command channel for the valve actuator.
    parameters:
      valve_id:
        description: Valve identifier in KKS encoding.
        schema:
          type: string
          pattern: '^[0-9]{2}[A-Z]{3}[0-9]{2}[A-Z]{2}[0-9]{3}$'
          example: 01JNA10AA001
    publish:
      operationId: sendValveCommand
      summary: Send control command to the valve
      message:
        contentType: application/json
        payload:
          type: object
          required:
            - action
          properties:
            action:
              type: string
              enum:
                - OPEN
                - CLOSE
                - STOP
              description: Command for the actuator.
              example: OPEN
            target_position:
              type: number
              format: float
              minimum: 0
              maximum: 100
              description: Target valve position in percent (for control valves).
              example: 50.0
