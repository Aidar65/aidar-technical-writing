openapi: 3.0.3
info:
  title: Valve Control API
  version: 1.2.0
  description: >-
    REST API дистанционного управления запорно-регулирующей арматурой (ТПА):
    команды открытия/закрытия и экстренной остановки (Fail-Safe).
paths:
  /api/v1/valves/{id}/control:
    post:
      summary: Отправить управляющую команду на электропривод затвора
      operationId: sendValveCommand
      parameters:
        - name: id
          in: path
          required: true
          description: Идентификатор арматуры в кодировке KKS (например, 01JNA10AA001)
          schema:
            type: string
            example: "01JNA10AA001"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [command]
              properties:
                command:
                  type: string
                  enum: [OPEN, CLOSE, STOP]
                  example: "OPEN"
      responses:
        "202":
          description: Команда принята в исполнение, подтверждение — по телеметрии
        "400":
          description: Некорректная команда или нарушение схемы запроса
