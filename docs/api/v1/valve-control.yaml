openapi: 3.0.3
info:
  title: Valve Control API
  version: 1.2.0
  description: Управление запорно-регулирующей арматурой (ТПА) по протоколу HTTP/REST
paths:
  /api/v1/valves/{id}/control:
    post:
      summary: Отправить команду на привод задвижки
      parameters:
        - name: id
          in: path
          required: true
          description: Инвентарный или KKS-код арматуры
          schema:
            type: string
            example: "01JNA10AA001"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - command
              properties:
                command:
                  type: string
                  enum: [OPEN, CLOSE, STOP]
                  example: "OPEN"
      responses:
        '202':
          description: Команда принята к исполнению приводом
        '400':
          description: Некорректная команда управления
