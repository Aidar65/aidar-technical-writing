openapi: 3.0.3
info:
  title: Valve Control API
  version: 1.0.0
  description: REST API управления электроприводами и считывания телеметрии запорно-регулирующей арматуры (ТПА).

security:
  - BearerAuth: []

paths:
  /api/v1/valves/{id}/position:
    post:
      summary: Изменение положения затвора арматуры
      operationId: setValvePosition
      parameters:
        - name: id
          in: path
          required: true
          description: Уникальный идентификатор ТПА (например, `valve-dn100-01`)
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - target_position
              properties:
                target_position:
                  type: integer
                  minimum: 0
                  maximum: 100
                  example: 100
      responses:
        '200':
          description: Команда успешно принята контроллером
        '401':
          description: Отсутствует или недействителен JWT-токен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '400':
          description: Ошибка параметров запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/valves/{id}/status:
    get:
      summary: Получение телеметрии и состояния концевых выключателей ТПА
      operationId: getValveStatus
      parameters:
        - name: id
          in: path
          required: true
          description: Уникальный идентификатор ТПА (например, `valve-dn100-01`)
          schema:
            type: string
      responses:
        '200':
          description: Актуальное состояние привода и концевиков
          content:
            application/json:
              schema:
                type: object
                required:
                  - valve_id
                  - position_percent
                  - is_closed
                  - is_open
                  - torque_nm
                properties:
                  valve_id:
                    type: string
                    example: "valve-dn100-01"
                  position_percent:
                    type: integer
                    minimum: 0
                    maximum: 100
                    example: 45
                  is_closed:
                    type: boolean
                    example: false
                  is_open:
                    type: boolean
                    example: false
                  torque_nm:
                    type: number
                    format: float
                    example: 120.5
        '401':
          description: Отсутствует или недействителен JWT-токен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "Авторизация АСУ ТП Верхнего Уровня через JWT-токен"

  schemas:
    ErrorResponse:
      type: object
      properties:
        error_code:
          type: string
          example: "INVALID_POSITION"
        message:
          type: string
          example: "Target position must be between 0 and 100"
          