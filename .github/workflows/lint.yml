name: Markdown Quality Control

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  markdown-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DavidAnson/markdownlint-cli2-action@v19
        with:
          globs: 'docs/**/*.md'
          config: '.markdownlint.json'

  spectral-lint:
    name: OpenAPI Quality Gate (Spectral)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Spectral Lint
        run: npx @stoplight/spectral-cli lint docs/system-analysis/integrations/openapi-spec.yaml
