name: Markdown Quality Control

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  markdown-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: nosorn/markdownlint-action@v3
        with:
          path: 'docs'
          config: '.markdownlint.json'
          