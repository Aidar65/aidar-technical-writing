site_name: 'Aidar Yarmakov | Docs-as-Code & Architecture'
site_url: https://aidar65.github.io/aidar-technical-writing/
site_description: Technical Content Engineer Portfolio — Docs-as-Code, OpenAPI, GOST, CI/CD

theme:
  name: material
  language: ru
  palette:
    primary: indigo
    accent: indigo
  features:
    - navigation.indexes
    - navigation.sections
    - content.code.copy

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_javascript:
  - https://unpkg.com/mermaid@10/dist/mermaid.min.js

nav:
  - Главная: index.md
  - Техническое писательство:
      - Развертывание оператора: technical-writing/how-to/k8s-operator-deploy.md
      - AI Doc Pipeline: technical-writing/explanation/ai-doc-pipeline.md
  - Системный анализ:
      - ЧТЗ Телеметрии (ГОСТ 34): system-analysis/gost-34/chtz-telemetry.md
      - Контракты API: system-analysis/integrations/openapi-spec.yaml
      - Sequence диаграммы: system-analysis/models/auth-flow.puml
