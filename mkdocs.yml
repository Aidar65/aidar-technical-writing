name: ci

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.x

      - name: Install dependencies
        run: |
          pip install mkdocs-material yamllint

      - name: Lint YAML Configuration
        run: |
          yamllint -d "{rules: {line-length: disable, document-start: disable}}" mkdocs.yml .github/workflows/

      - name: Lint Markdown Files
        uses: avto-dev/markdown-lint-action@v1
        with:
          args: 'docs/'

      - name: Build & Deploy Documentation
        run: mkdocs gh-deploy --forcear-technical-writing
