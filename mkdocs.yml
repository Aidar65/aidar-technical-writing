site_name: 'Aidar Yarmakov | Docs-as-Code & Architecture v1.3.0'
site_url: https://aidar65.github.io/aidar-technical-writing/
site_description: Technical Content Engineer Portfolio — Docs-as-Code, OpenAPI, GOST, CI/CD

theme:
  name: material
  language: ru
  palette:
    primary: indigo
    accent: indigo
  features:
    - navigation.indexes
    - navigation.sections
    - content.code.copy

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_javascript:
  - https://unpkg.com/mermaid@10/dist/mermaid.min.js

nav:
  - Главная: index.md
  - Tutorials (Быстрый старт):
      - Обзор: tutorials/quickstart.md
  - How-to Guides (Инструкции):
      - Развертывание оператора: how-to/k8s-operator-deploy.md
  - Reference (Справочники):
      - ЧТЗ Телеметрии (ГОСТ 34): reference/chtz-telemetry.md
      - Контракты API: system-analysis/integrations/openapi-spec.md
  - Explanation (Концепции):
      - AI Doc Pipeline: explanation/ai-doc-pipeline.md
      - Sequence диаграммы: system-analysis/sequence-diagrams.md
