name: ci

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.x

      - name: Install dependencies
        run: |
          pip install mkdocs-material yamllint

      - name: Lint YAML Configuration & OpenAPI Specs
        run: |
          yamllint mkdocs.yml .github/workflows/

      - name: Lint Markdown Files
        uses: avto-dev/markdown-lint-action@v1
        with:
          args: 'docs/'

      - name: Build & Deploy Documentation
        run: mkdocs gh-deploy --force
      - Спецификация OpenAPI: api/openapi.md
  - Docs-as-Code & ГОСТ:
      - ТЗ на Мониторинг (ГОСТ 19.201): docs-code/tz-gost19.md
      - Архитектура C4 (Mermaid): docs-code/architecture.md
  - Промышленный домен:
      - АСУТП Затвора: industrial/valve-asutp.md
repo_name: Aidar65/aidar-technical-writing
repo_url: https://github.com/Aidar65/aidar-technical-writing
